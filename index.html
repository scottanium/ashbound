  <style>
:root {
  --bg: #140f0c;

  --panel: rgba(24, 18, 14, 0.96);

  --muted: #b6a48f;
  --ember: #e36a2d;
  --ember-2: #ffb067;
  --life: #d4533a;
  --mana: #3f78d0;
  --xp: #e0b15a;
  --magic: #79b0ff;
  --rare: #f0d56a;
  --set: #63c56d;
  --unique: #e39a45;
  --ok: #9ddea0;
  --bad: #ff8d7a;
  --serif: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;

}

* { box-sizing: border-box; }
html, body {

button, input, textarea { font: inherit; color: inherit; }

button { cursor: pointer; }
#app { position: fixed; inset: 0; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.pe, .screen, #panel, #rotate-overlay { pointer-events: auto; }

#joystick, #joystick *, #belt-left, #belt-left *, #belt-right, #belt-right *,
#cast, #cast *, #dock, #dock *, #interact, #btn-attack, .skill-btn, .flask { pointer-events: auto; }
.hidden { display: none !important; }

.screen {

.brand { margin-top: auto; }

h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; }
h1 { font-size: 64px; letter-spacing: 0.02em; line-height: 0.9; }
.tag { margin: 8px 0 0; color: var(--muted); font-family: var(--serif); font-size: 18px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.slot-card, .class-card, .panel, .detail, .shop-row {

}
.slot-card, .class-card { padding: 12px; }
.slot-card strong, .class-card strong { font-family: var(--serif); font-size: 20px; }

.small { font-size: 13px; line-height: 1.4; }
.banner { color: var(--bad); min-height: 1.2em; }

.btn, button.btn {

  border-radius: 12px;
  min-height: 44px;
  padding: 8px 14px;

  font-family: var(--serif);
  letter-spacing: 0.03em;
}
.btn.primary {
  background: linear-gradient(#f0a05a, #c25420);

  border-color: #ffd0a4;

}
.btn:disabled { opacity: 0.45; }
.btn.slim { min-height: 36px; padding: 4px 10px; font-family: var(--sans); letter-spacing: 0; }
.grow { flex: 1; }

input[type="text"], textarea {

}

#hud { position: absolute; inset: 0; }

.bar.xp {

  font-family: var(--serif);
}
.orb.life {
  left: calc(18px + env(safe-area-inset-left));
  bottom: calc(122px + env(safe-area-inset-bottom));
  background: conic-gradient(#e36a4a calc(var(--pct) * 1%), #3a1814 0);
  border: 2px solid #8a4034;
}
.orb.mana {
  right: calc(18px + env(safe-area-inset-right));
  bottom: calc(122px + env(safe-area-inset-bottom));
  background: conic-gradient(#6ea0ef calc(var(--pct) * 1%), #142033 0);
  border: 2px solid #3d5c8a;
}
#minimap {
  position: absolute;
  top: calc(8px + env(safe-area-inset-top));
  right: calc(8px + env(safe-area-inset-right));

  height: 72px;

  border: 1px solid var(--line-dim);

}
#bossbar {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: calc(52px + env(safe-area-inset-top));
  width: min(420px, 48vw);
  background: rgba(16, 10, 8, 0.8);
  border: 1px solid #8a3a22;
  border-radius: 10px;
  padding: 6px 8px;
}
#bossbar .track { height: 8px; background: #2a1612; border-radius: 99px; overflow: hidden; }
#bossbar .track span { display: block; height: 100%; background: #ff5a1f; width: 0; }
#boss-name { font-family: var(--serif); font-size: 13px; color: #ffb067; }
#toasts {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);

  flex-direction: column;
  gap: 4px;
}
.toast {

}
.toast.good { color: var(--ok); }
.toast.bad { color: var(--bad); }
#hint {

  left: 50%;
  transform: translateX(-50%);

  max-width: min(340px, 36vw);
  text-align: center;
  color: var(--ember-2);
  font-size: 13px;
  text-shadow: 0 1px 2px #000;
  min-height: 1.2em;
}
#interact {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(92px + env(safe-area-inset-bottom));

}
#channel {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(86px + env(safe-area-inset-bottom));
  width: min(280px, 32vw);
  height: 8px;
  background: #2a211c;
  border-radius: 99px;
  overflow: hidden;
}
#channel span { display: block; height: 100%; background: var(--ember); }
#joystick {
  position: absolute;
  left: calc(10px + env(safe-area-inset-left));
  bottom: calc(8px + env(safe-area-inset-bottom));

  height: 108px;
  border-radius: 50%;
  background: rgba(20, 14, 10, 0.45);
  border: 2px solid rgba(227, 154, 69, 0.55);
  touch-action: none;
}
#stick {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #f0c090, #a85a30);
  position: absolute;
  left: 29px;
  top: 29px;
}
.flask-col { position: absolute; display: flex; flex-direction: column; gap: 6px; }
#belt-left {
  left: calc(126px + env(safe-area-inset-left));
  bottom: calc(14px + env(safe-area-inset-bottom));
}
#belt-right {
  right: calc(208px + env(safe-area-inset-right));
  bottom: calc(14px + env(safe-area-inset-bottom));
}
.flask {
  width: 46px;
  height: 44px;
  border-radius: 12px;
  border: 1px solid var(--line-dim);
  background: rgba(20, 14, 10, 0.78);
  font-size: 11px;
}
.flask.life { box-shadow: inset 0 -12px 0 #8e2c22; }
.flask.mana { box-shadow: inset 0 -12px 0 #244e96; }
#cast {
  position: absolute;
  right: calc(8px + env(safe-area-inset-right));
  bottom: calc(8px + env(safe-area-inset-bottom));
  display: flex;
  gap: 8px;
  align-items: end;
}
#skillbar { display: grid; grid-template-columns: 50px 50px; gap: 6px; }
.skill-btn, #btn-attack {
  position: relative;
  overflow: hidden;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: rgba(28, 18, 14, 0.82);
  color: var(--text);
}
.skill-btn { width: 50px; height: 50px; font-size: 11px; line-height: 1.1; }
.skill-btn .sweep {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 0;
  background: rgba(0, 0, 0, 0.55);
  pointer-events: none;
}
.skill-btn .key, #btn-attack .key {
  position: absolute;
  left: 4px;
  top: 2px;
  font-size: 10px;
  color: var(--muted);
}
#btn-attack {
  width: 74px;
  height: 74px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #f0a05a, #a8431c);
  color: #2a140c;
  font-family: var(--serif);
  font-weight: 700;
}
#dock {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(8px + env(safe-area-inset-bottom));
  display: flex;
  gap: 6px;
}
#dock button {
  min-height: 36px;
  min-width: 0;
  padding: 0 12px;
  border-radius: 12px;
  border: 1px solid var(--line-dim);
  background: rgba(22, 16, 12, 0.88);
  font-family: var(--serif);
  font-size: 14px;
}
body.panel-open #joystick,
body.panel-open #cast,
body.panel-open #belt-left,
body.panel-open #belt-right,
body.panel-open #dock,
body.panel-open #life-orb,
body.panel-open #mana-orb,
body.panel-open #interact { visibility: hidden; }

#rotate-overlay {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 30;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(10, 7, 5, 0.94);
}
body.portrait-phone #rotate-overlay { display: flex; }
.rotate-card {
  width: min(360px, 100%);
  text-align: center;
  background: #221912;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px 18px;
}
.rotate-card p { color: var(--muted); }
.phone-turn {
  width: 46px;
  height: 78px;
  margin: 0 auto 14px;
  border: 3px solid var(--ember-2);
  border-radius: 10px;
  position: relative;
  animation: turn-phone 1.8s ease-in-out infinite;
}
.phone-turn::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 7px;
  width: 14px;
  height: 3px;
  border-radius: 2px;
  background: var(--ember-2);
  transform: translateX(-50%);
}
@keyframes turn-phone {
  0%, 18% { transform: rotate(0deg); }
  55%, 100% { transform: rotate(-90deg); }
}
@media (prefers-reduced-motion: reduce) {
  .phone-turn { animation: none; transform: rotate(-90deg); }
}
body.hurt #ui { box-shadow: inset 0 0 80px rgba(160, 20, 10, 0.35); }

#panel {
  position: absolute;
  inset: 0;
  background: var(--panel);
  z-index: 4;
  display: flex;
  flex-direction: column;
  padding: calc(8px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));
  gap: 8px;
}
.panel-head, .tabs { display: flex; gap: 8px; align-items: center; }
.panel-head h2 { flex: 1; font-size: 28px; }
.panel-body { overflow: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; }
.detail {
  max-height: 42%;
  overflow: auto;
  padding: 10px;
  border-color: var(--line);
}
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
.stat {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
  background: #1a1410;
  border-radius: 10px;
  padding: 6px 8px;
}
.plus {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: #3a2a20;
  font-size: 20px;
}
.paper {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.slot {
  min-height: 52px;
  border-radius: 10px;
  border: 1px dashed var(--line-dim);
  background: #1a1410;
  padding: 4px;
  text-align: left;
}
.slot small { display: block; color: var(--muted); font-size: 10px; }
.grid {
  display: grid;
  grid-template-columns: repeat(var(--cols), var(--cell));
  grid-template-rows: repeat(var(--rows), var(--cell));
  width: max-content;
  background: #120e0b;
  border: 1px solid var(--line-dim);
  border-radius: 8px;
  position: relative;
}
.grid .cell { border: 1px solid rgba(255, 220, 180, 0.05); pointer-events: none; }
.gitem {
  margin: 2px;
  border-radius: 4px;
  background: #2a211a;
  border: 1px solid var(--line-dim);
  color: var(--text);
  font-size: 10px;
  line-height: 1.15;
  text-align: left;
  padding: 2px;
  overflow: hidden;
  z-index: 1;
}
.gitem.is-sel, .slot.is-sel, .skill-node.is-sel, .shop-row.is-sel { outline: 2px solid var(--ember-2); }
.rar-common { color: #e6dece; }
.rar-magic { color: var(--magic); }
.rar-rare { color: var(--rare); }
.rar-set { color: var(--set); }
.rar-unique { color: var(--unique); }
.rar-rune { color: #ff8a4a; }
.rar-gem { color: #7dcea0; }
.line { margin: 2px 0; }
.line.good { color: var(--ok); }
.line.bad { color: var(--bad); }
.sockets { display: flex; gap: 6px; margin: 6px 0; }
.sock {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  font-size: 10px;
  background: #120e0b;
}
.tree { display: flex; flex-direction: column; gap: 12px; }
.branch h3 { margin-bottom: 6px; }
.skill-node {
  width: 100%;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  text-align: left;
  padding: 8px;
  margin-bottom: 6px;
  border-radius: 12px;
  border: 1px solid var(--line-dim);
  background: #1c1612;
}
.skill-node .rank { color: var(--ember-2); }
.shop-row { display: flex; justify-content: space-between; gap: 8px; padding: 8px; align-items: center; width: 100%; text-align: left; }
.map-wrap { overflow: auto; }
#zone-map { width: 100%; height: auto; border-radius: 8px; background: #0c0907; }
.keys { display: grid; gap: 4px; }

@media (min-aspect-ratio: 1/1) {
  .screen {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    padding: 22px 28px;
    gap: 24px;
  }
  .brand { margin-top: 0; }
  .screen-copy { flex: 1.1; align-self: center; }
  .screen-slots, .screen-form { flex: 0.9; max-width: 460px; align-self: center; }
  h1 { font-size: 54px; }
  #panel {
    inset: 10px 14px;
    display: grid;
    grid-template-columns: minmax(0, 1.45fr) minmax(230px, 0.72fr);
    grid-template-rows: auto auto minmax(0, 1fr);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  #panel .panel-head { grid-column: 1 / -1; grid-row: 1; }
  #panel .tabs { grid-column: 1 / -1; grid-row: 2; }
  #panel .panel-body { grid-column: 1; grid-row: 3; min-height: 0; }
  #panel .detail { grid-column: 2; grid-row: 3; max-height: none; align-self: stretch; }
  #panel .panel-body:last-child { grid-column: 1 / -1; }
  .tree { flex-direction: row; align-items: flex-start; }
  .branch { flex: 1; min-width: 0; }
  .panel-head h2 { font-size: 24px; }
}

@media (min-width: 1100px) and (min-aspect-ratio: 1/1) {
  #panel {
    inset: 4vh auto;
    left: 50%;
    transform: translateX(-50%);
    width: min(1080px, 92vw);
  }
  #minimap { width: 120px; height: 90px; }
}
